name: card_battle
description: Flutter + Flame ile geliştirilen mobil kart savaşı oyunu.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Oyun motoru ---
  flame: ^1.18.0          # 2D oyun motoru (savaş arenası, sürükle-bırak)
  flame_audio: ^2.10.0    # Ses efektleri ve müzik (isteğe bağlı)

  # --- Firebase (bulut kayıt) ---
  firebase_core: ^3.0.0   # Firebase başlatma
  cloud_firestore: ^5.0.0 # Altın, elmas ve deste verileri
  firebase_auth: ^5.0.0   # Anonim giriş (oyuncu kimliği için)

  # --- Durum yönetimi ---
  provider: ^6.1.2        # Oyuncu verisini ekranlar arası paylaşmak için

  # --- Yerel depolama ---
  shared_preferences: ^2.2.3 # Ayarlar ve çevrimdışı önbellek

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Görseller ve sesler eklendiğinde aşağıdaki satırları açın:
  assets:
    - assets/images/
