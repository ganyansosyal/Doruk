name: APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android klasörünü oluştur
        run: flutter create --org com.editpro --project-name editpro --platforms android .

      - name: Uygulama adını EditPro yap
        run: sed -i 's/android:label="[^"]*"/android:label="EditPro"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: EditPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
