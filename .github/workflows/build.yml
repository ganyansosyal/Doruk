name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android klasörü repoda yok; burada otomatik oluşturuluyor
      - name: Android klasörünü oluştur
        run: flutter create --platforms=android --org com.doruk --project-name doruk .

      # Firebase için minSdk 23, release APK için internet izni, uygulama adı
      - name: Android ayarlarını düzelt
        run: |
          sed -i -E 's/minSdk(Version)?( =)? ?flutter\.minSdkVersion/minSdk\1\2 23/' android/app/build.gradle* || true
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Doruk"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "minSdk" android/app/build.gradle* || true
          grep -n "INTERNET\|android:label" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: doruk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
