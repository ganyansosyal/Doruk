name: APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android klasörünü oluştur
        run: flutter create --org com.editpro --project-name editpro --platforms android .

      - name: Uygulama adını EditPro yap
        run: sed -i 's/android:label="[^"]*"/android:label="EditPro"/' android/app/src/main/AndroidManifest.xml

      - name: ImageMagick kur
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Uygulama ikonunu yap
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${d%%:*}"; size="${d##*:}"
            convert assets/logo.png -resize ${size}x${size} android/app/src/main/res/mipmap-$name/ic_launcher.png
          done

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: EditPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
