# .github/workflows/build.yml
# Her push'ta ve elle tetiklenince Android APK üretir.

name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repoda android/ klasörü yok; burada otomatik oluşturuluyor.
      # Mevcut lib/ ve pubspec.yaml dosyalarının üzerine yazılmaz.
      - name: Android klasörünü oluştur
        run: flutter create . --platforms=android --project-name card_battle --org com.example

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: APK derle
        run: flutter build apk --release

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: kart-savasi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
