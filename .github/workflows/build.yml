name: APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android klasörünü oluştur
        run: flutter create --org com.editpro --project-name editpro --platforms android .

      - name: Uygulama adını EditPro yap
        run: sed -i 's/android:label="[^"]*"/android:label="EditPro"/' android/app/src/main/AndroidManifest.xml

      - name: Video köprüsünü ekle (Kotlin + Media3)
        run: |
          f=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          pkg=$(grep -m1 '^package ' "$f")
          { echo "$pkg"; tail -n +2 android_overrides/MainActivity.kt; } > "$f"
          if [ -f android/app/build.gradle.kts ]; then
          cat >> android/app/build.gradle.kts <<'GRADLE'

          dependencies {
              implementation("androidx.media3:media3-transformer:1.5.1")
              implementation("androidx.media3:media3-effect:1.5.1")
              implementation("androidx.media3:media3-common:1.5.1")
          }
          GRADLE
          else
          cat >> android/app/build.gradle <<'GRADLE'

          dependencies {
              implementation 'androidx.media3:media3-transformer:1.5.1'
              implementation 'androidx.media3:media3-effect:1.5.1'
              implementation 'androidx.media3:media3-common:1.5.1'
          }
          GRADLE
          fi

      - name: ImageMagick kur
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Uygulama ikonunu yap
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${d%%:*}"; size="${d##*:}"
            convert assets/logo.png -resize ${size}x${size} android/app/src/main/res/mipmap-$name/ic_launcher.png
          done

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: EditPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
